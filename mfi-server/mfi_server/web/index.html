<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="app_title"></title>
    <link rel="stylesheet" href="style.css">
    <script src="common.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__title">
        <h1 data-i18n="app_title"></h1>
        <span id="version" class="topbar__version"></span>
      </div>
      <div class="topbar__controls">
        <label class="topbar__label" for="lang" data-i18n="lang_label"></label>
        <select id="lang">
          <option value="en" data-i18n="lang_en"></option>
          <option value="it" data-i18n="lang_it"></option>
        </select>
        <button id="logout-button" type="button" data-i18n="logout"></button>
      </div>
      <nav class="tabs">
        <a class="tab" href="#overview" aria-current="page" data-i18n="nav_overview"></a>
        <a class="tab" href="#devices-tab" data-i18n="nav_devices"></a>
        <a class="tab" href="#discovery-tab" data-i18n="nav_search"></a>
        <a class="tab" href="automations.html" data-i18n="nav_automations"></a>
      </nav>
    </header>
    <main class="page">
      <section id="login" class="panel panel--login" hidden>
        <h2 data-i18n="login_heading"></h2>
        <input id="password" type="password" autocomplete="current-password" data-i18n-placeholder="password_label">
        <button id="login-button" type="button" data-i18n="login_button"></button>
        <p id="login-message" class="message"></p>
      </section>
      <section id="overview" class="tab-section" hidden>
        <p id="backup-message" class="message" hidden></p>
        <div class="tiles">
          <div class="tile">
            <span class="tile__label" data-i18n="tile_power"></span>
            <span class="tile__value" id="tile-power"></span>
          </div>
          <div class="tile">
            <span class="tile__label" data-i18n="tile_connected"></span>
            <span class="tile__value" id="tile-connected"></span>
          </div>
          <div class="tile">
            <span class="tile__label" data-i18n="tile_disconnected"></span>
            <span class="tile__value" id="tile-disconnected"></span>
          </div>
          <div class="tile">
            <span class="tile__label" data-i18n="tile_outlets"></span>
            <span class="tile__value" id="tile-outlets"></span>
          </div>
        </div>
      </section>
      <section id="devices-tab" class="tab-section" hidden>
        <h2 data-i18n="devices_heading"></h2>
        <section id="chart" class="panel" hidden>
          <h3 id="chart-title"></h3>
          <button id="chart-close" type="button" data-i18n="chart_close"></button>
          <svg id="chart-svg" viewBox="0 0 600 200"></svg>
          <div class="chart__stats">
            <span id="chart-min"></span>
            <span id="chart-max"></span>
          </div>
        </section>
        <div id="devices"></div>
      </section>
      <section id="discovery-tab" class="tab-section" hidden>
        <section class="panel">
          <div class="section__head">
            <h2 data-i18n="discovery_heading"></h2>
            <button id="discovery-search" type="button" class="button button--primary" data-i18n="discovery_search"></button>
          </div>
          <div id="discovery"></div>
        </section>
        <section class="panel" id="wifi-setup">
          <h2 data-i18n="wifi_setup_heading"></h2>
          <p data-i18n="wifi_setup_text"></p>
          <a class="button" data-i18n="wifi_setup_download" href="https://github.com/oce-projects/oce-mfi-home-assistant/releases/latest" target="_blank" rel="noopener noreferrer"></a>
        </section>
      </section>
    </main>
  </body>
</html>
