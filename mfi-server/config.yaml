# =============================================================================
# Home Assistant app (add-on) "mFi Server" - configuration
# Full history in CHANGELOG.md
# Format: https://developers.home-assistant.io/docs/apps/configuration
# No "image" key: the Supervisor builds the container locally from the Dockerfile.
# =============================================================================
name: "mFi Server (new)"
version: "0.18.0"
slug: "mfi_server"
description: "New mFi controller written from scratch in pure Python, no Ubiquiti code. Recommended."
url: "https://github.com/oce-projects/oce-mfi-home-assistant"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
host_network: true
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:power-socket-eu
panel_title: mFi
services:
  - mqtt:want
map:
  - "share:ro"
options:
  backup_file: ""
  log_level: info
  mqtt_topic_prefix: mfi
  mqtt_discovery_prefix: homeassistant
  ingress_peer: ""
  server_address: ""
  device_ssh_username: ""
  device_ssh_password: ""
  ssh_extra_options: "KexAlgorithms=+diffie-hellman-group1-sha1,diffie-hellman-group14-sha1;HostKeyAlgorithms=+ssh-rsa;Ciphers=+aes128-cbc,3des-cbc"
schema:
  backup_file: "str?"
  log_level: "list(debug|info|warning|error)"
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
  ingress_peer: "str?"
  server_address: "str?"
  device_ssh_username: "str?"
  device_ssh_password: "password?"
  ssh_extra_options: "str?"
