configuration:
  java_max_memory_mb:
    name: "Memoria massima di Java (MB)"
    description: "Memoria massima (heap) per il processo Java del controller, in megabyte. Valore predefinito 1024. Aumentala solo se il controller esaurisce la memoria."
  record_traffic:
    name: "Registra il traffico dei dispositivi"
    description: "Accende il registratore di compatibilità sulle porte 6080 (inform) e 6443 (web) e cattura in sola ascolto il traffico UDP delle porte 10001 (scoperta) e 3478 (risveglio). Le registrazioni vanno in /share/mfi-recordings. Spento di default: con l'opzione spenta non viene registrato nulla, ma l'add-on usa comunque la rete dell'host."
  record_max_mb:
    name: "Limite di dimensione della registrazione (MB)"
    description: "Limite giornaliero della dimensione delle registrazioni, in megabyte (da 10 a 2000). Valore predefinito 200. Raggiunto il limite, il registratore smette di scrivere per quel giorno."
