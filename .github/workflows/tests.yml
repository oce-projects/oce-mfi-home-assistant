name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository tests
        run: python3 -m unittest discover -s tests -v
      - name: mfi-server tests
        run: python3 -m unittest discover -s mfi-server/tests -t mfi-server -v
      - name: mfi-wifi-setup tests
        run: python3 -m unittest discover -s mfi-wifi-setup/tests -t mfi-wifi-setup -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mfi-server image
        run: docker build -t mfi-server-ci mfi-server
